name: Verify PEND Phase 3
on:
  push:
    branches: [pend-phase3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and reconcile pinned dependency versions
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: TypeScript
        run: npm run typecheck
      - name: Protocol, pairing, presence and resume tests
        run: npm run test:all
      - name: Next.js production build
        run: npm run build

      - name: Export reconciled lockfile
        uses: actions/upload-artifact@v4
        with:
          name: PEND-Phase3-package-lock
          path: package-lock.json
          retention-days: 14
