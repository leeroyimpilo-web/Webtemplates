name: ShareDit Android debug APK

on:
  push:
    branches:
      - sharedit-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout ShareDit starter
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare ShareDit Android source
        run: bash scripts/bootstrap.sh

      - name: Build debug APK
        working-directory: upstream-app
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload ShareDit debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShareDit-debug-apk
          path: upstream-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
