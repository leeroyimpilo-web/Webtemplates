name: Verify PEND Phase 0
on:
  push:
    branches:
      - pend-phase0
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit generated lockfile if missing
        if: success()
        run: |
          if [ ! -f package-lock.json ]; then exit 1; fi
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Lock PEND Phase 0 dependencies"
            git push origin HEAD:pend-phase0
          fi
      - name: Upload package lockfile artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pend-package-lock
          path: package-lock.json
          if-no-files-found: warn
